<div id="wrap" class="entier">
    <nav class="navbar navbar-expand navbar-dark bg-dark">
        <a href="#" class="navbar-brand">Clinic-Online</a>
        <ul class="navbar-nav mr-auto" routerLinkActive="active">
            <li *ngIf="!isLoggedIn" class="nav-item">
                <a href="/home" class="nav-link" routerLink="home">Home </a>
            </li>
            <li class="nav-item">
                <a routerLink="maladies" class="nav-link">Maladies</a>
            </li>
            <li class="nav-item" *ngIf="isLoggedIn">
                <a href="/fichesuser" class="nav-link" routerLink="fichesuser">Fiches</a>
            </li>
            <li class="nav-item" *ngIf="isLoggedIn">
                <a href="/ordonnances" class="nav-link" routerLink="ordonnances">Ordonnances</a>
            </li>
        </ul>
        <ul class="navbar-nav ml-auto" *ngIf="!isLoggedIn">
            <li class="nav-item">
                <a href="/register" class="nav-link" routerLink="register">Inscription</a>
            </li>
            <li class="nav-item">
                <a href="/login" class="nav-link" routerLink="login">Connection</a>
            </li>
        </ul>

        <ul class="navbar-nav ml-auto" *ngIf="isLoggedIn">
            <li class="nav-item">
                <a href="/profile/{{iduser}}" class="nav-link" routerLink="profile/{{iduser}}">{{ username }}</a>
            </li>
            <li class="nav-item">
                <a href class="nav-link" (click)="logout()">Deconnexion</a>
            </li>
        </ul>
    </nav>

    <div id="main" class="container mt-3">
        <router-outlet></router-outlet>
    </div>
</div>
<!-- Site footer -->
<footer class="footer text-center">
    <p class="copyright-text">Copyright &copy; 2020 All Rights
        <a href="/registerDoctor" routerLink="registerDoctor" style="text-decoration:none; color:inherit;">Reserved</a>
    </p>
</footer>
