<div class="container">
    <h1>Liste des medicaments</h1>
    <a href="#" routerLink="/medicaments/addmedicament" class="btn btn-success">Ajouter un medicament</a>
    <table class="table table-bordered">
        <tr>
            <th>ID</th>
            <th>Nom</th>
            <th width="220px">Action</th>
        </tr>
        <tr *ngFor="let medicament of medicaments">
            <td>{{ medicament.id }}</td>
            <td>{{ medicament.name }}</td>
            <td>
                <a href="#" [routerLink]="['/medicaments/', medicament.id]" class="btn btn-info">Voir</a>
                <a href="#" [routerLink]="['/medicaments/updatemedicament', medicament.id]" class="btn btn-primary">Modifier</a>
                <button type="button" (click)="deleteMedicament(medicament.id)" class="btn btn-danger">Supprimer</button>
            </td>
        </tr>
    </table>
</div>
