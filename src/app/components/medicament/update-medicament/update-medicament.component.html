<div>
    <h1>Modifier medicament</h1>
    <form [formGroup]="form" (ngSubmit)="submitForm()">
        <div class="form-group">
            <label for="body">Nom</label>
            <input formControlName="name" id="body" type="text" [(ngModel)]="medicament.name" class="form-control">
            <div *ngIf="f.name.touched && f.name.invalid" class="alert alert-danger">
                <div *ngIf="f.name.errors.required">Veuillez entrer une valeur</div>
            </div>
        </div>
        <button class="btn btn-primary" type="submit" [disabled]="!form.valid">Modifier</button>
    </form>
</div>
