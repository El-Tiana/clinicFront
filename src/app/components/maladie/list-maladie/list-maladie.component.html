<div class="container">
    <h1>Liste des maladies</h1>
    <a *ngIf="isDoctor" href="#" routerLink="/maladies/addmaladie" class="btn btn-success m-2">Ajouter une maladie</a>
    <table class="table table-bordered">
        <tr>
            <th>Nom</th>
            <th width="300px">Action</th>
        </tr>
        <tr *ngFor="let maladie of maladies">
            <td>{{ maladie.name }}</td>
            <td>
                <a href="#" [routerLink]="['/maladies/', maladie.id]" class="btn btn-info mx-1">Voir</a>
                <a href="#" *ngIf="isDoctor" [routerLink]="['/maladies/updatemaladie', maladie.id]" class="btn btn-primary mx-1">Modifier</a>
                <button *ngIf="isDoctor" type="button" (click)="deleteMaladie(maladie.id)" class="btn btn-danger mx-1">Supprimer</button>
            </td>
        </tr>
    </table>
</div>
